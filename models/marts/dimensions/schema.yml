version: 2

models:

  - name: dim_customers
    description: One row per customer_unique_id; includes customer location and lifetime order metrics
    columns:
      - name: customer_unique_id
        description: Primary key representing the real-world customer
        tests:
          - not_null
          - unique
      - name: customer_zip_code_prefix
        description: First 5 digits of Brazilian ZIP code
      - name: customer_city
        description: City where the customer resides
      - name: customer_state
        description: Two-letter Brazilian state code
      - name: first_order_at
        description: Timestamp of the customer’s first order
      - name: last_order_at
        description: Timestamp of the customer’s most recent order
      - name: lifetime_order_count
        description: Total number of orders placed by the customer
      - name: lifetime_revenue
        description: Total revenue generated by the customer
      - name: avg_order_value
        description: Average revenue per order
      - name: avg_actual_delivery_days
        description: Average actual delivery time for delivered orders
      - name: avg_estimated_delivery_days
        description: Average estimated delivery time
      - name: late_delivery_count
        description: Number of orders delivered late
      - name: delivered_order_count
        description: Number of delivered orders
      - name: late_delivery_percentage
        description: Percentage of delivered orders that were late

  - name: dim_products
    description: One row per product_id; includes product attributes and category information
    columns:
      - name: product_id
        description: Primary key of the product
        tests:
          - not_null
          - unique
      - name: product_category_name
        description: Product category name in Portuguese
      - name: product_name_length
        description: Length of product name
      - name: product_description_length
        description: Length of product description
      - name: product_photos_qty
        description: Number of product photos
      - name: product_weight_g
        description: Weight in grams
      - name: product_length_cm
        description: Length in cm
      - name: product_height_cm
        description: Height in cm
      - name: product_width_cm
        description: Width in cm

  - name: dim_sellers
    description: One row per seller_id; includes seller location attributes
    columns:
      - name: seller_id
        description: Primary key of the seller
        tests:
          - not_null
          - unique
      - name: seller_zip_code_prefix
        description: First 5 digits of ZIP code
      - name: seller_city
        description: Seller city
      - name: seller_state
        description: Two-letter Brazilian state code